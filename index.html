<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      // ----------------------------------------------------
      // COMPONENT 1: MASTER GAME MANAGER
      // ----------------------------------------------------
      AFRAME.registerComponent('game-manager', {
        init: function () {
          let el = this.el;
          let startBtn = document.querySelector('#start-btn');
          
          let videoPlane1 = document.querySelector('#phase-1-video-plane');
          let video1 = document.querySelector('#phase1-video');
          let videoPlane4 = document.querySelector('#phase-4-video-plane');
          let video4 = document.querySelector('#phase4-video');
          
          let envContainer = document.querySelector('#shared-environment');
          let phase2Container = document.querySelector('#phase-2-germs');
          let phase3Container = document.querySelector('#phase-3-spray');
          
          let phase2Audio = document.querySelector('#phase2-audio');
          let phase3Audio = document.querySelector('#phase3-audio');
          
          let currentPhase = 0; 

          // Logic Trackers
          let allGermsDead = false;
          let phase2AudioDone = false;
          
          let flowersMaxed = false;
          let phase3AudioDone = false;

          video1.loop = false;
          if(video4) video4.loop = false;

          // --- START BUTTON CLICK ---
          startBtn.addEventListener('click', function () {
            if (currentPhase !== 0) return; 
            currentPhase = 1;
            console.log("Start tapped. Unlocking media...");

            video1.currentTime = 0; video1.play().catch(e => console.log(e)); 
            if (phase2Audio) { phase2Audio.play().catch(e => console.log(e)); phase2Audio.pause(); }
            if (phase3Audio) { phase3Audio.play().catch(e => console.log(e)); phase3Audio.pause(); }

            startBtn.emit('fadeOut');
            startBtn.classList.remove('clickable');

            setTimeout(() => {
              startBtn.setAttribute('visible', 'false'); 
              videoPlane1.setAttribute('visible', 'true'); 
              console.log("STARTING PHASE 1");
            }, 1000);
          });

          // --- PHASE 1 -> PHASE 2 ---
          video1.addEventListener('ended', function() {
            if (currentPhase !== 1) return;
            currentPhase = 2;
            console.log("STARTING PHASE 2");
            
            videoPlane1.setAttribute('visible', 'false');
            envContainer.setAttribute('visible', 'true');
            phase2Container.setAttribute('visible', 'true');
            
            let hitboxes = document.querySelectorAll('.germ-hitbox');
            hitboxes.forEach(h => h.classList.add('clickable'));

            if (phase2Audio) {
              phase2Audio.currentTime = 0;
              phase2Audio.play();
            }
          });

          // --- PHASE 2 -> PHASE 3 LOGIC ---
          let checkPhase3Start = function() {
            if (currentPhase === 2 && allGermsDead && phase2AudioDone) {
              currentPhase = 3;
              console.log("STARTING PHASE 3");
              
              phase2Container.setAttribute('visible', 'false');
              phase3Container.setAttribute('visible', 'true');

              // Start the staggered fade-in animations
              let anims = phase3Container.querySelectorAll('[animation]');
              anims.forEach(animEl => animEl.emit('startAnim'));

              if (phase3Audio) {
                phase3Audio.currentTime = 0;
                phase3Audio.play();
              }

              // Wait exactly 8 seconds for all sprites to finish fading in before enabling the spray tap
              setTimeout(() => {
                document.querySelector('.spray-hitbox').classList.add('clickable');
              }, 8000);
            }
          };

          el.addEventListener('germs-cleared', function() {
            allGermsDead = true;
            checkPhase3Start();
          });

          if (phase2Audio) {
            phase2Audio.addEventListener('ended', function() {
              phase2AudioDone = true;
              checkPhase3Start();
            });
          }

          // --- PHASE 3 -> PHASE 4 LOGIC (Whichever finishes last) ---
          let checkPhase4Start = function() {
            if (currentPhase === 3 && flowersMaxed && phase3AudioDone) {
              currentPhase = 4;
              console.log("STARTING PHASE 4");
              
              // Wait 1.5 seconds after both requirements are met before transitioning
              setTimeout(() => {
                phase3Container.setAttribute('visible', 'false');
                envContainer.setAttribute('visible', 'false'); 
                
                videoPlane4.setAttribute('visible', 'true');
                
                if (video4) {
                  video4.currentTime = 0;
                  video4.play();
                }
              }, 1500);
            }
          };

          el.addEventListener('flowers-maxed', function() {
            flowersMaxed = true;
            checkPhase4Start();
          });

          if (phase3Audio) {
            phase3Audio.addEventListener('ended', function() {
              phase3AudioDone = true;
              checkPhase4Start();
            });
          }
        }
      });

      // ----------------------------------------------------
      // COMPONENT 2: THE GERM DESTRUCTION LOGIC
      // ----------------------------------------------------
      let germsRemaining = 5; 
      AFRAME.registerComponent('germ-logic', {
        init: function () {
          let el = this.el; 
          let visual = el.parentNode.querySelector('.germ-visual');
          
          let handleTap = function (e) {
            if (!el.classList.contains('clickable')) return;
            el.classList.remove('clickable'); 

            let popSound = document.querySelector('#pop-sound');
            if (popSound) { popSound.currentTime = 0; popSound.play().catch(e => console.log(e)); }

            let frames = ['#d1', '#d2', '#d3', '#d4', '#d5', '#d6'];
            let currentFrame = 0;

            let animInterval = setInterval(() => {
              if (currentFrame < frames.length) {
                visual.setAttribute('src', frames[currentFrame]);
                currentFrame++;
              } else {
                clearInterval(animInterval);
                el.parentNode.setAttribute('visible', 'false'); 
                
                germsRemaining--;
                
                if (germsRemaining <= 0) {
                  el.sceneEl.emit('germs-cleared');
                }
              }
            }, 100); 
          };
          el.addEventListener('click', handleTap);
          el.addEventListener('touchstart', handleTap);
        }
      });

      // ----------------------------------------------------
      // COMPONENT 3: SPRAY BOTTLE LOGIC
      // ----------------------------------------------------
      AFRAME.registerComponent('spray-logic', {
        init: function () {
          let el = this.el;
          let clicks = 0;
          
          let smell1 = document.querySelector('#smell1-layer');
          let smell2 = document.querySelector('#smell2-layer');
          let flowers = document.querySelector('#flowers-layer');
          let textTap = document.querySelector('#texttotap-layer');
          let popSound = document.querySelector('#pop-sound');
          let video4 = document.querySelector('#phase4-video'); 

          let handleTap = function (e) {
            if (!el.classList.contains('clickable')) return;
            
            // Unlock Video 4 perfectly timed to save memory
            if (clicks === 0 && video4) {
               video4.play().catch(err => console.log(err));
               video4.pause();
            }

            if (popSound) { popSound.currentTime = 0; popSound.play().catch(e => console.log(e)); }

            clicks++;

            if (clicks === 1) {
               // Remove A-Frame animations so they don't fight our manual opacity changes
               smell1.removeAttribute('animation');
               smell2.removeAttribute('animation');
               textTap.removeAttribute('animation');
               textTap.setAttribute('material', 'opacity', '0');
            }

            let opacityGained = clicks / 3; 
            let opacityLost = 1 - opacityGained; 

            flowers.setAttribute('material', 'opacity', opacityGained);
            smell1.setAttribute('material', 'opacity', opacityLost);
            smell2.setAttribute('material', 'opacity', opacityLost);

            if (clicks >= 3) {
              el.classList.remove('clickable'); 
              el.sceneEl.emit('flowers-maxed'); 
            }
          };

          el.addEventListener('click', handleTap);
          el.addEventListener('touchstart', handleTap);
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <a-scene game-manager embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      
      <a-assets>
        <audio id="pop-sound" src="pop.mp3" preload="auto"></audio>
        <audio id="phase2-audio" src="phase2-audio.mp3" preload="auto"></audio>
        <audio id="phase3-audio" src="phase3-audio.mp3" preload="auto"></audio>
        
        <video id="phase1-video" src="Video1.webm" preload="auto" playsinline webkit-playsinline></video>
        <video id="phase4-video" src="Video2.webm" preload="auto" playsinline webkit-playsinline></video>

        <img id="oil1" src="Oil1.png">
        <img id="oil2" src="Oil2.png">
        <img id="instruction-text" src="destroy-text.png">
        <img id="germ-idle" src="germ-idle.png">
        <img id="d1" src="destroy1.png">
        <img id="d2" src="destroy2.png">
        <img id="d3" src="destroy3.png">
        <img id="d4" src="destroy4.png">
        <img id="d5" src="destroy5.png">
        <img id="d6" src="destroy6.png">
        <img id="grass1" src="grass1.png">
        <img id="grass2" src="grass2.png">

        <img id="skull1" src="Skull 1.png">
        <img id="skull2" src="Skull 2.png">
        <img id="smell1" src="Smell 1.png">
        <img id="smell2" src="Smell 2.png">
        <img id="spraybottle" src="SprayBottle.png">
        <img id="texttotap" src="TexttoTap.png">
        <img id="flowers" src="Flowers.png">
      </a-assets>

      <a-marker preset="hiro">
        
        <a-image id="start-btn" src="Start.png" position="0 0.5 0" width="1.5" height="1" rotation="-90 0 0" class="clickable" animation="property: components.material.material.opacity; to: 0; dur: 1000; startEvents: fadeOut"></a-image>
        
        <a-entity id="phase-1-video-plane" visible="false">
            <a-plane src="#phase1-video" position="0 0.5 0" rotation="-90 0 0" width="1.8" height="3.2" transparent="true"></a-plane>
        </a-entity>

        <a-entity id="shared-environment" visible="false" scale="0.5 0.5 0.5">
          <a-image src="#grass1" position="0 0.4 0" width="4" height="7.11" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
          <a-image src="#grass2" position="0 0.5 0" width="4" height="7.11" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
        </a-entity>

        <a-entity id="phase-2-germs" visible="false" scale="0.5 0.5 0.5">
          <a-image src="#oil1" position="-1.5 0.6 1.8" width="0.9" height="0.9" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
          <a-image src="#oil2" position="-0.7 0.6 2.0" width="0.6" height="1.1" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
          <a-image src="#instruction-text" position="0 0.6 0.4" width="3" height="5.33" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>

          <a-entity class="germ-cluster" position="-0.9 0.55 0.5">
            <a-image class="germ-visual" src="#germ-idle" width="1.5" height="2.66" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
            <a-plane class="germ-hitbox" germ-logic position="0 0.01 0" width="1.5" height="2.66" rotation="-90 0 0" material="opacity: 0; transparent: true; depthWrite: false"></a-plane>
          </a-entity>
          <a-entity class="germ-cluster" position="0.9 0.55 0.5">
            <a-image class="germ-visual" src="#germ-idle" width="1.5" height="2.66" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
            <a-plane class="germ-hitbox" germ-logic position="0 0.01 0" width="1.5" height="2.66" rotation="-90 0 0" material="opacity: 0; transparent: true; depthWrite: false"></a-plane>
          </a-entity>
          <a-entity class="germ-cluster" position="0 0.55 0">
            <a-image class="germ-visual" src="#germ-idle" width="1.5" height="2.66" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
            <a-plane class="germ-hitbox" germ-logic position="0 0.01 0" width="1.5" height="2.66" rotation="-90 0 0" material="opacity: 0; transparent: true; depthWrite: false"></a-plane>
          </a-entity>
          <a-entity class="germ-cluster" position="-0.9 0.55 -0.8">
            <a-image class="germ-visual" src="#germ-idle" width="1.5" height="2.66" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
            <a-plane class="germ-hitbox" germ-logic position="0 0.01 0" width="1.5" height="2.66" rotation="-90 0 0" material="opacity: 0; transparent: true; depthWrite: false"></a-plane>
          </a-entity>
          <a-entity class="germ-cluster" position="0.9 0.55 -0.8">
            <a-image class="germ-visual" src="#germ-idle" width="1.5" height="2.66" rotation="-90 0 0" material="alphaTest: 0.5"></a-image>
            <a-plane class="germ-hitbox" germ-logic position="0 0.01 0" width="1.5" height="2.66" rotation="-90 0 0" material="opacity: 0; transparent: true; depthWrite: false"></a-plane>
          </a-entity>
        </a-entity>

        <!-- PHASE 3: SPRAY BOTTLE & FLOWERS -->
        <a-entity id="phase-3-spray" visible="false" scale="0.5 0.5 0.5">
          
          <!-- Staggered Y heights by 0.002 to completely stop Z-Fighting -->
          <!-- All start at opacity: 0 and are triggered by the startAnim event -->
          
          <a-image id="skull1-layer" src="#skull1" position="0 0.510 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false" animation="property: material.opacity; from: 0; to: 1; dur: 1000; delay: 0; startEvents: startAnim"></a-image>
          <a-image id="skull2-layer" src="#skull2" position="0 0.512 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false" animation="property: material.opacity; from: 0; to: 1; dur: 1000; delay: 0; startEvents: startAnim"></a-image>
          
          <a-image id="smell1-layer" src="#smell1" position="0 0.514 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false" animation="property: material.opacity; from: 0; to: 1; dur: 2000; delay: 1000; startEvents: startAnim"></a-image>
          <a-image id="smell2-layer" src="#smell2" position="0 0.516 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false" animation="property: material.opacity; from: 0; to: 1; dur: 2000; delay: 1000; startEvents: startAnim"></a-image>
          
          <a-image id="flowers-layer" src="#flowers" position="0 0.518 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false"></a-image>
          
          <a-image id="spraybottle-layer" src="#spraybottle" position="0 0.520 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false" animation="property: material.opacity; from: 0; to: 1; dur: 1000; delay: 5000; startEvents: startAnim"></a-image>
          <a-image id="texttotap-layer" src="#texttotap" position="0 0.522 0" width="4" height="7.11" rotation="-90 0 0" material="transparent: true; opacity: 0; depthWrite: false" animation="property: material.opacity; from: 0; to: 1; dur: 2000; delay: 6000; startEvents: startAnim"></a-image>

          <a-plane class="spray-hitbox" spray-logic position="0.8 0.56 0" width="2" height="3" rotation="-90 0 0" material="opacity: 0; transparent: true; depthWrite: false"></a-plane>
        </a-entity>

        <!-- PHASE 4: FINAL VIDEO -->
        <a-entity id="phase-4-video-plane" visible="false">
            <a-plane src="#phase4-video" position="0 0.5 0" rotation="-90 0 0" width="1.8" height="3.2" transparent="true"></a-plane>
        </a-entity>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
